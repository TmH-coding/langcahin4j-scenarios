spring.application.name=scenario-7-mcp-protocol
server.port=8087

# LLM Configuration
llm.provider=openai
llm.model=gpt-4-turbo-preview
llm.temperature=0.7
llm.max-tokens=2048
llm.timeout=60

# MCP Configuration
mcp.server.enabled=true
mcp.server.port=3000
mcp.client.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.langchain4j.scenarios=DEBUG
