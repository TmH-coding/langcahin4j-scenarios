spring.application.name=scenario-8-vector-database
server.port=8088

# ============================================================
# 向量存储类型切换（核心配置）
# ============================================================
# 选项：inmemory（默认）| milvus | qdrant | weaviate
vector.store.type=inmemory

# ============================================================
# Milvus 配置（vector.store.type=milvus 时生效）
# ============================================================
milvus.host=localhost
milvus.port=19530
milvus.collection-name=langchain4j_rag

# ============================================================
# Qdrant 配置（vector.store.type=qdrant 时生效）
# ============================================================
qdrant.host=localhost
qdrant.grpc-port=6334
qdrant.collection-name=langchain4j_rag

# ============================================================
# Weaviate 配置（vector.store.type=weaviate 时生效）
# ============================================================
weaviate.host=localhost
weaviate.port=8080
weaviate.class-name=LangChain4jRag

# ============================================================
# 禁用不需要的 Spring 自动配置
# ============================================================
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
spring.cloud.nacos.config.import-check.enabled=false
spring.cloud.nacos.discovery.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# ============================================================
# LLM 配置
# ============================================================
llm.provider=openai
llm.model=gpt-4-turbo-preview
llm.temperature=0.7
llm.max-tokens=2048
llm.timeout=60

# ============================================================
# Embedding 配置
# ============================================================
embedding.enabled=true

# ============================================================
# RAG 参数
# ============================================================
rag.max-results=5
rag.min-score=0.3

# ============================================================
# 日志
# ============================================================
logging.level.root=INFO
logging.level.com.langchain4j.scenarios=DEBUG
